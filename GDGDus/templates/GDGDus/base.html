<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Manajemen Stok Kardus{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Stok Kardus</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="/merek">Merek</a></li>
                    <li class="nav-item"><a class="nav-link" href="/masterdus">Master Dus</a></li>
                    <li class="nav-item"><a class="nav-link" href="/dus">Dus</a></li>
                    <li class="nav-item"><a class="nav-link" href="/transaksimasuk/tambah">Transaksi Masuk</a></li>
                    <li class="nav-item"><a class="nav-link" href="/transaksikeluar/tambah">Transaksi Keluar</a></li>
                    <li class="nav-item"><a class="nav-link" href="/transaksimasuk">Laporan Transaksi Masuk</a></li>
                    <li class="nav-item"><a class="nav-link" href="/transaksikeluar">Laporan Transaksi Keluar</a></li>
                    <li class="nav-item"><a class="nav-link" href="/stok">Laporan Stok</a></li>
                    
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
