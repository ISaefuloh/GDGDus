
{% extends 'GDGDus/base.html' %}
{% block title %}Delete Transaksi{% endblock %}

<!-- transaksi_delete.html -->
{% block content %}
    <h2>Are you sure you want to delete this transaction?</h2>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'stok-list' %}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
